<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d5dfc">
  <title>One Very Important Question</title>
  <style>
    :root { color-scheme: light; --ink:#20213a; --muted:#666984; --accent:#6d5dfc; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:radial-gradient(circle at top left,#e8e4ff 0,transparent 38%),linear-gradient(135deg,#f8f7ff,#eef7ff);
    }
    main {
      width:min(100%,440px); padding:clamp(26px,6vw,42px); text-align:center;
      background:rgba(255,255,255,.94); border:1px solid #e8e6fb; border-radius:28px;
      box-shadow:0 22px 70px rgba(44,37,112,.13);
    }
    .mark { width:62px;height:62px;display:grid;place-items:center;margin:0 auto 18px;border-radius:20px;background:#eeeaff;color:var(--accent);font-size:30px; }
    h1 { font-size:clamp(1.7rem,6vw,2.15rem); line-height:1.15; margin:0 0 12px; }
    p { color:var(--muted); line-height:1.6; margin:0 0 24px; }
    .buttons { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
    button { appearance:none;border:0;border-radius:14px;padding:15px 18px;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s; }
    button:hover { transform:translateY(-2px);box-shadow:0 8px 20px #28205c18; }
    button:focus-visible { outline:3px solid #a69dff;outline-offset:3px; }
    .yes { background:#efedff;color:#4c3fe0; }
    .no { background:var(--accent);color:white; }
    .note { font-size:.82rem;margin:20px 0 0;color:#8587a0; }
    #status { margin-top:20px;font-weight:650;color:#3e397b; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main aria-labelledby="question">
    <div class="mark" aria-hidden="true">✦</div>
    <h1 id="question">Do you like kids?</h1>
    <p>Answer honestly. This is definitely a very official survey. 👀</p>
    <div class="buttons" id="choices">
      <button class="yes" type="button" id="yesButton">Yes</button>
      <button class="no" type="button" id="noButton">No</button>
    </div>
    <p class="note">Just a silly question — no personal details needed.</p>
    <p id="status" role="status" aria-live="polite" hidden></p>
  </main>
  <script>
    const choices = document.getElementById('choices');
    const status = document.getElementById('status');

    document.getElementById('yesButton').addEventListener('click', () => {
      choices.hidden = true;
      status.hidden = false;
      status.textContent = 'Answer recorded: YES. The survey committee thanks you. ✨';
    });

    document.getElementById('noButton').addEventListener('click', async () => {
      choices.hidden = true;
      status.hidden = false;
      status.textContent = 'Interesting answer… 👀';

      // FormSubmit's AJAX endpoint can notify the site owner after the recipient
      // activates the address. This sends only the selected answer, not an IP.
      try {
        const response = await fetch('https://formsubmit.co/ajax/daviolvcass@gmail.com', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            _subject: 'Website response: No',
            _template: 'table',
            Answer: 'No',
            Notice: 'A visitor selected No on the question page.'
          })
        });
        const result = await response.json().catch(() => ({}));
        if (response.ok && (result.success === 'true' || result.success === true)) {
          status.textContent = 'Interesting answer… 👀 Your response was submitted.';
        } else {
          status.textContent = 'Interesting answer… 👀 Email notifications may need the recipient to activate FormSubmit first.';
        }
      } catch {
        status.textContent = 'Interesting answer… 👀 The answer is shown, but email could not be confirmed. The owner may need to activate FormSubmit first.';
      }
    });
  </script>
</body>
</html>
